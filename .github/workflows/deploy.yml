name: Deploy marketplace-control to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-control-vps-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure restricted SSH key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${VPS_DEPLOY_KEY:?Missing VPS_DEPLOY_KEY}"
          : "${VPS_DEPLOY_HOST:?Missing VPS_DEPLOY_HOST}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
      - name: Package exact commit
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/release.tar.gz" "$GITHUB_SHA"
      - name: Deploy to VPS
        env:
          VPS_DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@$VPS_DEPLOY_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/release.tar.gz"
      - name: Verify public site
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 \
            https://marketplace.185-147-157-25.sslip.io/api/health -o /dev/null
